name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and typecheck (${{ matrix.app }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - api
          - web

    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/${{ matrix.app }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        if: matrix.app == 'api'
        run: pnpm exec prisma generate

      - name: Run tests
        run: pnpm exec vitest run

      - name: Typecheck
        run: pnpm exec tsc --noEmit

  accessibility:
    name: Accessibility (Chromium desktop/mobile)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run deterministic accessibility suite
        env:
          A11Y_KEEP_STACK: "1"
        run: ./scripts/a11y-test.sh

      - name: Show service logs after failure
        if: failure()
        run: docker compose -f docker-compose.a11y.yml logs --no-color

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: |
            apps/web/playwright-report
            apps/web/test-results/accessibility
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop disposable accessibility environment
        if: always()
        run: docker compose -f docker-compose.a11y.yml down --volumes --remove-orphans
